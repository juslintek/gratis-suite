services:
  wordpress:
    image: wordpress:6.7-php8.3-apache
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html
      # Gratis ecosystem mounts
      - ../cache-manager:/var/www/html/wp-content/plugins/cache-manager
      - ../gratis-builder:/var/www/html/wp-content/plugins/gratis-builder
      - ../gratis-backup:/var/www/html/wp-content/plugins/gratis-backup
      - ../gratis-db:/var/www/html/wp-content/plugins/gratis-db
      - ../gratis-ai:/var/www/html/wp-content/plugins/gratis-ai
      - ../gratis-theme:/var/www/html/wp-content/themes/gratis-theme
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ../cache-manager:/var/www/html/wp-content/plugins/cache-manager
      - ../gratis-builder:/var/www/html/wp-content/plugins/gratis-builder
      - ../gratis-backup:/var/www/html/wp-content/plugins/gratis-backup
      - ../gratis-db:/var/www/html/wp-content/plugins/gratis-db
      - ../gratis-ai:/var/www/html/wp-content/plugins/gratis-ai
      - ../gratis-theme:/var/www/html/wp-content/themes/gratis-theme
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - cli
    entrypoint: wp
    command: "--info"

volumes:
  wp_data:
  db_data:
