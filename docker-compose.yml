# Gratis local dev — FrankenPHP + SQLite (parity with production gratis.superglobalsdevelopment.com)
# Previous Apache+MariaDB stack backed up as docker-compose.apache.yml.bak
services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.franken
      args:
        PHP_VERSION: ${PHP_VERSION:-8.6}
    image: gratis-franken:local
    ports:
      - "${PORT:-8080}:80"
    environment:
      WP_HOME: "http://localhost:${PORT:-8080}"
      WP_SITEURL: "http://localhost:${PORT:-8080}"
    volumes:
      - wp_db:/app/public/wp-content/database
      - wp_uploads:/app/public/wp-content/uploads
      - ../gratis-theme:/app/public/wp-content/themes/gratis-theme
      - ../gratis-access/:/app/public/wp-content/plugins/gratis-access
      - ../gratis-affiliate/:/app/public/wp-content/plugins/gratis-affiliate
      - ../gratis-ai/:/app/public/wp-content/plugins/gratis-ai
      - ../gratis-analytics/:/app/public/wp-content/plugins/gratis-analytics
      - ../gratis-automation/:/app/public/wp-content/plugins/gratis-automation
      - ../gratis-backup/:/app/public/wp-content/plugins/gratis-backup
      - ../gratis-booking/:/app/public/wp-content/plugins/gratis-booking
      - ../gratis-builder/:/app/public/wp-content/plugins/gratis-builder
      - ../gratis-cache/:/app/public/wp-content/plugins/gratis-cache
      - ../gratis-cdn/:/app/public/wp-content/plugins/gratis-cdn
      - ../gratis-commerce/:/app/public/wp-content/plugins/gratis-commerce
      - ../gratis-community/:/app/public/wp-content/plugins/gratis-community
      - ../gratis-comply/:/app/public/wp-content/plugins/gratis-comply
      - ../gratis-crm/:/app/public/wp-content/plugins/gratis-crm
      - ../gratis-db/:/app/public/wp-content/plugins/gratis-db
      - ../gratis-devtools/:/app/public/wp-content/plugins/gratis-devtools
      - ../gratis-docs/:/app/public/wp-content/plugins/gratis-docs
      - ../gratis-events/:/app/public/wp-content/plugins/gratis-events
      - ../gratis-fleet/:/app/public/wp-content/plugins/gratis-fleet
      - ../gratis-forms/:/app/public/wp-content/plugins/gratis-forms
      - ../gratis-installer/:/app/public/wp-content/plugins/gratis-installer
      - ../gratis-invoice/:/app/public/wp-content/plugins/gratis-invoice
      - ../gratis-learn/:/app/public/wp-content/plugins/gratis-learn
      - ../gratis-mail/:/app/public/wp-content/plugins/gratis-mail
      - ../gratis-media/:/app/public/wp-content/plugins/gratis-media
      - ../gratis-notify/:/app/public/wp-content/plugins/gratis-notify
      - ../gratis-popup/:/app/public/wp-content/plugins/gratis-popup
      - ../gratis-project/:/app/public/wp-content/plugins/gratis-project
      - ../gratis-reviews/:/app/public/wp-content/plugins/gratis-reviews
      - ../gratis-security/:/app/public/wp-content/plugins/gratis-security
      - ../gratis-seo/:/app/public/wp-content/plugins/gratis-seo
      - ../gratis-social/:/app/public/wp-content/plugins/gratis-social
      - ../gratis-tables/:/app/public/wp-content/plugins/gratis-tables
      - ../gratis-translate/:/app/public/wp-content/plugins/gratis-translate
    restart: unless-stopped

volumes:
  wp_db:
  wp_uploads:
